<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GLASSES & HAT | Face Tracking 3D AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030a13;font-family:system-ui,'Noto Sans Thai',sans-serif;color:#e9fcff}
a-scene{position:absolute!important;z-index:1!important;background:transparent!important}
a-scene canvas{background:transparent!important}
body>video{position:absolute!important;z-index:0!important;display:block!important;visibility:visible!important;opacity:1!important}
#hud{position:fixed;z-index:10;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(92%,470px);padding:14px 18px;background:linear-gradient(120deg,#071524e8,#10213ce0);border:1px solid #36ebdd80;border-radius:19px;box-shadow:0 5px 30px #0ef1cd29;text-align:center;pointer-events:none}
h1{margin:0;font-size:20px;letter-spacing:2px;color:#5bffe1}#hint{font-size:12px;line-height:1.6;margin:5px 0 0;color:#d4e8fa}
#panel{position:fixed;z-index:10;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94%,500px);border:1px solid #6afde873;background:#071322eb;padding:15px;border-radius:22px;box-shadow:0 10px 45px #0009;backdrop-filter:blur(12px)}
#state{text-align:center;font-size:13px;color:#c7eee9;margin-bottom:12px}
#choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
button{font:600 12px/1.3 inherit;border:1px solid #44dbcb88;background:#12263d;color:#d6fcf5;padding:11px 5px;border-radius:12px;cursor:pointer;min-height:48px}
button.active{background:linear-gradient(140deg,#29f5cf,#80caff);color:#052034;border-color:transparent;box-shadow:0 0 12px #45f7dd55}
#help{font-size:11px;opacity:.7;text-align:center;margin:11px 0 0}
#error{position:fixed;top:38%;z-index:12;left:7%;width:86%;text-align:center;padding:14px;background:#4b1020e8;border-radius:14px;display:none}
</style>
</head>
<body>
<div id="hud"><h1>GLASSES & HAT / 3D AR</h1><p id="hint">อนุญาตกล้อง แล้วหันหน้าเข้าหาหน้าจอ</p></div>
<div id="error"></div>
<div id="panel">
  <div id="state" aria-live="polite">กำลังโหลดระบบติดตามใบหน้า…</div>
  <div id="choices">
    <button class="active" data-mode="both">BOTH</button>
    <button data-mode="glasses">GLASSES</button>
    <button data-mode="hat">HAT</button>
  </div>
  <div id="help">แสดงแว่นตรงตาและหมวกตรงหัว • เปิดผ่าน HTTPS และอนุญาตกล้อง</div>
</div>

<a-scene id="scene" mindar-face="autoStart: true; faceOccluder: false;" embedded color-space="sRGB" renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera active="false" position="0 0 0"></a-camera>

  <!-- Face center / nose bridge for glasses -->
  <a-entity id="faceCenter" mindar-face-target="anchorIndex: 1">
    <a-entity id="glassesGroup" visible="true" position="0 0.02 0.14">
      <!-- left lens -->
      <a-torus radius="0.18" radius-tubular="0.018" position="-0.18 0 0" color="#82fff2" material="emissive:#2ce0d0;emissiveIntensity:.8"></a-torus>
      <a-circle radius="0.155" position="-0.18 0 -0.005" color="#244967" opacity="0.45" material="transparent:true; side:double; emissive:#0a2035; emissiveIntensity:.15"></a-circle>
      <!-- right lens -->
      <a-torus radius="0.18" radius-tubular="0.018" position="0.18 0 0" color="#82fff2" material="emissive:#2ce0d0;emissiveIntensity:.8"></a-torus>
      <a-circle radius="0.155" position="0.18 0 -0.005" color="#244967" opacity="0.45" material="transparent:true; side:double; emissive:#0a2035; emissiveIntensity:.15"></a-circle>
      <!-- bridge -->
      <a-box width="0.12" height="0.03" depth="0.02" position="0 0 0" color="#8afdf0" material="emissive:#2ce0d0; emissiveIntensity:.7"></a-box>
      <!-- side arms -->
      <a-box width="0.18" height="0.025" depth="0.02" position="-0.37 0.03 -0.05" rotation="0 18 -8" color="#d9e6f2"></a-box>
      <a-box width="0.18" height="0.025" depth="0.02" position="0.37 0.03 -0.05" rotation="0 -18 8" color="#d9e6f2"></a-box>
      <!-- small center glow -->
      <a-sphere radius="0.03" position="0 -0.01 0.02" color="#ff66d9" material="emissive:#ff1fcf; emissiveIntensity:.9"></a-sphere>
    </a-entity>
  </a-entity>

  <!-- Forehead/top anchor for hat -->
  <a-entity id="headTop" mindar-face-target="anchorIndex: 10">
    <a-entity id="hatGroup" visible="true" position="0 0.42 0.12" rotation="0 0 0">
      <!-- brim -->
      <a-cylinder radius="0.42" height="0.035" color="#131a24" material="metalness:.45; roughness:.45"></a-cylinder>
      <!-- crown -->
      <a-cylinder radius="0.23" height="0.28" position="0 0.15 0" color="#0a6a65" material="metalness:.3; roughness:.45"></a-cylinder>
      <!-- band -->
      <a-cylinder radius="0.245" height="0.05" position="0 0.08 0" color="#52ffe0" material="emissive:#1ce6ce; emissiveIntensity:.6"></a-cylinder>
      <!-- top gem -->
      <a-sphere radius="0.05" position="0 0.32 0" color="#ff67d5" material="emissive:#ff1fcf; emissiveIntensity:.9" animation="property:scale;dir:alternate;to:1.15 1.15 1.15;loop:true;dur:850"></a-sphere>
    </a-entity>
  </a-entity>
</a-scene>

<script>
const scene=document.querySelector('#scene');
const state=document.querySelector('#state');
const error=document.querySelector('#error');
const glassesGroup=document.getElementById('glassesGroup');
const hatGroup=document.getElementById('hatGroup');

scene.addEventListener('renderstart',()=>{
  if(scene.renderer){
    scene.renderer.setClearColor(0x000000,0);
    scene.renderer.setClearAlpha(0);
  }
});

function changeMode(mode){
  const showGlasses = mode==='both' || mode==='glasses';
  const showHat = mode==='both' || mode==='hat';
  glassesGroup.setAttribute('visible', showGlasses);
  hatGroup.setAttribute('visible', showHat);
  for(const b of document.querySelectorAll('button[data-mode]')){
    const selected = b.dataset.mode===mode;
    b.classList.toggle('active', selected);
    b.setAttribute('aria-pressed', String(selected));
  }
}

for(const button of document.querySelectorAll('button[data-mode]')){
  button.addEventListener('click',()=>changeMode(button.dataset.mode));
}

scene.addEventListener('arReady',()=>{
  state.textContent='กล้องพร้อมแล้ว — หันหน้าเข้ากล้องเพื่อดูแว่นและหมวก';
  const v=scene.parentNode.querySelector('video') || document.querySelector('video');
  if(v){
    v.style.zIndex='0';
    v.style.display='block';
    v.style.visibility='visible';
    v.style.opacity='1';
    v.setAttribute('playsinline','');
    v.play().catch(()=>{});
  }
});

scene.addEventListener('targetFound',()=>{
  state.textContent='ตรวจพบใบหน้า ✓ — ลองขยับหน้าและสลับโหมด';
});

scene.addEventListener('targetLost',()=>{
  state.textContent='ไม่พบใบหน้า — หันหน้าเข้ากล้องอีกครั้ง';
});

scene.addEventListener('arError',()=>{
  error.style.display='block';
  error.textContent='เปิด AR ไม่สำเร็จ โปรดอนุญาตกล้อง ตรวจว่าเปิดผ่าน HTTPS และลองใช้ Safari หรือ Chrome';
  state.textContent='เกิดข้อผิดพลาดในการเปิดกล้อง';
});

changeMode('both');
</script>
</body>
</html>
