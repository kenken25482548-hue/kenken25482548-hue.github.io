<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEON GEAR | Face Tracking 3D AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030a13;font-family:system-ui,'Noto Sans Thai',sans-serif;color:#e9fcff}a-scene{position:absolute!important;z-index:1!important;background:transparent!important}a-scene canvas{background:transparent!important}body>video{position:absolute!important;z-index:0!important;display:block!important;visibility:visible!important;opacity:1!important} #hud{position:fixed;z-index:10;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(92%,470px);padding:14px 18px;background:linear-gradient(120deg,#071524e8,#10213ce0);border:1px solid #36ebdd80;border-radius:19px;box-shadow:0 5px 30px #0ef1cd29;text-align:center;pointer-events:none}h1{margin:0;font-size:20px;letter-spacing:2px;color:#5bffe1}#hint{font-size:12px;line-height:1.6;margin:5px 0 0;color:#d4e8fa}#panel{position:fixed;z-index:10;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94%,500px);border:1px solid #6afde873;background:#071322eb;padding:15px;border-radius:22px;box-shadow:0 10px 45px #0009;backdrop-filter:blur(12px)}#state{text-align:center;font-size:13px;color:#c7eee9;margin-bottom:12px}#choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}button{font:600 12px/1.3 inherit;border:1px solid #44dbcb88;background:#12263d;color:#d6fcf5;padding:11px 5px;border-radius:12px;cursor:pointer;min-height:48px}button.active{background:linear-gradient(140deg,#29f5cf,#80caff);color:#052034;border-color:transparent;box-shadow:0 0 12px #45f7dd55}#help{font-size:11px;opacity:.7;text-align:center;margin:11px 0 0}#error{position:fixed;top:38%;z-index:12;left:7%;width:86%;text-align:center;padding:14px;background:#4b1020e8;border-radius:14px;display:none}
</style></head>
<body>
<div id="hud"><h1>NEON GEAR / 3D AR</h1><p id="hint">อนุญาตกล้อง แล้วหันหน้าเข้าหาหน้าจอ</p></div>
<div id="error"></div>
<div id="panel"><div id="state" aria-live="polite">กำลังโหลดระบบติดตามใบหน้า…</div><div id="choices"><button class="active" data-mode="visor">CYBER VISOR</button><button data-mode="halo">HOLO HALO</button><button data-mode="antenna">ROBOT ANTENNA</button></div><div id="help">เปลี่ยนวัตถุ 3D ได้ทันที • ต้องเปิดผ่าน HTTPS และอนุญาตกล้อง</div></div>
<a-scene id="scene" mindar-face="autoStart: true; faceOccluder: true;" embedded color-space="sRGB" renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-camera active="false" position="0 0 0"></a-camera>
<a-entity mindar-face-target="anchorIndex: 168" id="forehead">
<!-- Three styles use real 3D primitives, attached to a tracked face anchor. -->
<a-entity id="visor" visible="true" position="0 0.25 0.08">
<a-box width="1.08" height=".22" depth=".13" position="0 0 0" color="#063749" opacity="0.9" material="metalness:.6;roughness:.15;transparent:true"></a-box>
<a-box width="1.16" height=".032" depth=".16" position="0 .115 0" color="#3bf6ea" material="emissive:#0be8d7;emissiveIntensity:.7"></a-box>
<a-box width="1.16" height=".032" depth=".16" position="0 -.115 0" color="#3bf6ea" material="emissive:#0be8d7;emissiveIntensity:.7"></a-box>
<a-box width=".05" height=".18" depth=".16" position="-.54 0 0" color="#8dfbf0"></a-box><a-box width=".05" height=".18" depth=".16" position=".54 0 0" color="#8dfbf0"></a-box>
<a-box width=".12" height=".04" depth=".18" position="0 0 .04" color="#fc74fb" material="emissive:#f600b9;emissiveIntensity:.8"></a-box>
</a-entity>
<a-entity id="halo" visible="false" position="0 .65 0">
<a-torus radius=".46" radius-tubular=".022" rotation="75 0 0" color="#ffe68a" material="emissive:#e6b928;emissiveIntensity:.75" animation="property:rotation;to:75 360 0;loop:true;dur:6000;easing:linear"></a-torus>
<a-torus radius=".35" radius-tubular=".012" rotation="75 0 0" color="#51caff" material="emissive:#1aa6ff;emissiveIntensity:.8"></a-torus>
<a-sphere radius=".065" position="0 .08 .32" color="#fff5ab" material="emissive:#f8df55;emissiveIntensity:.75" animation="property:position;dir:alternate;to:0 .15 .32;loop:true;dur:950"></a-sphere>
</a-entity>
<a-entity id="antenna" visible="false" position="0 .48 0">
<a-cylinder radius=".035" height=".42" position="-.3 .08 0" rotation="0 0 -15" color="#c6d2ef" material="metalness:.7;roughness:.2"></a-cylinder>
<a-cylinder radius=".035" height=".42" position=".3 .08 0" rotation="0 0 15" color="#c6d2ef" material="metalness:.7;roughness:.2"></a-cylinder>
<a-sphere radius=".105" position="-.35 .3 0" color="#52ffe0" material="emissive:#2bffe2;emissiveIntensity:.9" animation="property:scale;to:1.2 1.2 1.2;loop:true;dir:alternate;dur:630"></a-sphere>
<a-sphere radius=".105" position=".35 .3 0" color="#ff61db" material="emissive:#f20fc5;emissiveIntensity:.9" animation="property:scale;to:1.2 1.2 1.2;loop:true;dir:alternate;dur:800"></a-sphere>
<a-box width=".72" height=".13" depth=".08" position="0 -.15 .09" color="#3ce9e5" material="metalness:.7;roughness:.25"></a-box>
</a-entity>
</a-entity></a-scene>
<script>
const scene=document.querySelector('#scene');
scene.addEventListener('renderstart',()=>{if(scene.renderer){scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0);}});
const state=document.querySelector('#state');
const error=document.querySelector('#error');
const modes=['visor','halo','antenna'];
function changeMode(mode){if(!modes.includes(mode))return;for(const id of modes)document.getElementById(id).setAttribute('visible',id===mode);for(const b of document.querySelectorAll('button[data-mode]')){const selected=b.dataset.mode===mode;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected));}}
for(const button of document.querySelectorAll('button[data-mode]'))button.addEventListener('click',()=>changeMode(button.dataset.mode));
scene.addEventListener('arReady',()=>{state.textContent='กล้องพร้อมแล้ว — หันหน้าเข้ากล้องเพื่อดูวัตถุ 3D';const v=scene.parentNode.querySelector('video');if(v){v.style.zIndex='0';v.style.display='block';v.style.visibility='visible';v.style.opacity='1';v.setAttribute('playsinline','');v.play().catch(()=>{});}scene.style.zIndex='1';if(scene.renderer){scene.renderer.setClearColor(0,0);scene.renderer.setClearAlpha(0);}});
scene.addEventListener('targetFound',()=>{state.textContent='ตรวจพบใบหน้า ✓ — ลองหมุนหน้าและเปลี่ยนสไตล์';});
scene.addEventListener('targetLost',()=>{state.textContent='ไม่พบใบหน้า — หันหน้าเข้ากล้องอีกครั้ง';});
scene.addEventListener('arError',()=>{error.style.display='block';error.textContent='เปิด AR ไม่สำเร็จ โปรดอนุญาตกล้อง ตรวจว่าเปิดผ่าน HTTPS และลองใช้ Chrome หรือ Safari';state.textContent='เกิดข้อผิดพลาดในการเปิดกล้อง';});
changeMode('visor');
</script></body></html>
