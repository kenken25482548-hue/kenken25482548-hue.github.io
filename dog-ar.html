
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dog AR</title>

  <!-- โหลด A-Frame ก่อน MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171923;
      color: white;
      font-family: Arial, Tahoma, sans-serif;
    }

    /* ฉากไม่ใช้ embedded เพื่อให้แสดงเต็มจอ */
    body {
      position: fixed;
      inset: 0;
    }

    .header {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 0;
      width: 100%;
      z-index: 100;
      text-align: center;
      padding: 12px;
      background: linear-gradient(
        to bottom,
        rgba(15, 17, 25, .8),
        transparent
      );
      pointer-events: none;
    }

    .header h1 {
      margin: 0 0 5px;
      font-size: 23px;
      color: #ffbd69;
    }

    .header p {
      margin: 0;
      font-size: 13px;
    }

    .back {
      position: fixed;
      top: max(100px, calc(env(safe-area-inset-top) + 80px));
      left: 12px;
      z-index: 110;
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      background: #ffbd69;
      color: #222;
      font-weight: bold;
      font-size: 14px;
    }

    .status {
      position: fixed;
      left: 5%;
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 90%;
      z-index: 100;
      padding: 15px;
      text-align: center;
      border-radius: 16px;
      background: rgba(20, 22, 33, .92);
      border: 1px solid rgba(255,255,255,.18);
      pointer-events: none;
    }

    #message {
      font-weight: bold;
      font-size: 16px;
      margin: 0 0 5px;
    }

    #detail {
      font-size: 12px;
      line-height: 1.6;
      color: #d4d7e3;
      margin: 0;
      overflow-wrap: anywhere;
    }

    /* ปล่อยให้ MindAR จัดขนาดวิดีโอและ canvas */
    a-scene:not([embedded]) {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>🐶 DOG AR</h1>
    <p>ส่องรูปหมาเพื่อแสดงโมเดล 3D</p>
  </header>

  <button class="back" onclick="location.href='./index.html'">
    ← กลับหน้าหลัก
  </button>

  <div class="status">
    <p id="message">กำลังเริ่มระบบ AR...</p>
    <p id="detail">กรุณารอและอนุญาตการใช้กล้อง</p>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item
        id="dogModel"
        src="./dog_puppy.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="dogTarget"
      mindar-image-target="targetIndex: 0">

      <a-gltf-model
        id="dog"
        src="#dogModel"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.2 0.2 0.2">
      </a-gltf-model>

    </a-entity>

  </a-scene>

  <script>
    const message = document.getElementById("message");
    const detail = document.getElementById("detail");
    const scene = document.querySelector("a-scene");
    const target = document.getElementById("dogTarget");
    const dog = document.getElementById("dog");

    let modelLoaded = false;
    let imageFound = false;

    function showStatus() {
      if (imageFound && modelLoaded) {
        message.textContent = "🐶 พบรูปหมาแล้ว!";
        detail.textContent = "โมเดล 3D ควรปรากฏบนรูปที่กำลังส่อง";
      } else if (imageFound) {
        message.textContent = "ตรวจพบรูปแล้ว";
        detail.textContent = "กำลังโหลดโมเดลหมา...";
      } else if (modelLoaded) {
        message.textContent = "โมเดลโหลดสำเร็จ";
        detail.textContent = "หันกล้องไปยังรูปที่ใช้สร้าง targets.mind";
      }
    }

    dog.addEventListener("model-loaded", function () {
      modelLoaded = true;
      showStatus();
      console.log("DOG MODEL LOADED");
    });

    dog.addEventListener("model-error", function (event) {
      message.textContent = "โหลดโมเดลไม่สำเร็จ";
      detail.textContent = "ตรวจสอบ dog_puppy.glb";
      console.error("DOG MODEL ERROR", event);
    });

    target.addEventListener("targetFound", function () {
      imageFound = true;
      showStatus();
      console.log("IMAGE TARGET FOUND");
    });

    target.addEventListener("targetLost", function () {
      imageFound = false;
      showStatus();
      message.textContent = "กำลังค้นหารูป...";
      detail.textContent = "ถือกล้องให้เห็นรูป Tracker ชัดเจน";
    });

    scene.addEventListener("arReady", function () {
      message.textContent = "กล้องพร้อมใช้งาน";
      detail.textContent = "ส่องไปยังรูปหมาที่ใช้สร้าง Tracker";
      showStatus();
      console.log("AR READY");
    });

    scene.addEventListener("arError", function (event) {
      message.textContent = "เปิดกล้องหรือระบบ AR ไม่สำเร็จ";
      detail.textContent =
        "ตรวจสิทธิ์กล้อง อินเทอร์เน็ต และไฟล์ targets.mind";
      console.error("AR ERROR", event);
    });

    scene.addEventListener("loaded", function () {
      console.log("A-FRAME SCENE LOADED");
    });

    window.addEventListener("error", function (event) {
      console.error("PAGE ERROR", event.message);
    });
  </script>

</body>
</html>
