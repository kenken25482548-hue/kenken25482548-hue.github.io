
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dog AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171923;
      font-family: Arial, Tahoma, sans-serif;
      color: white;
    }

    .header {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: 0;
      width: 100%;
      z-index: 10;
      text-align: center;
      padding: 14px;
      pointer-events: none;
      background: linear-gradient(#171923bb, transparent);
    }

    .header h1 {
      margin: 0 0 5px;
      font-size: 23px;
      color: #ffbd69;
    }

    .header p {
      margin: 0;
      font-size: 13px;
    }

    .back {
      position: fixed;
      z-index: 20;
      top: calc(env(safe-area-inset-top, 0px) + 85px);
      left: 12px;
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      background: #ffbd69;
      color: #222;
      font-weight: bold;
    }

    .status {
      position: fixed;
      z-index: 10;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 15px);
      left: 5%;
      width: 90%;
      padding: 14px;
      text-align: center;
      border: 1px solid #ffffff30;
      border-radius: 16px;
      background: #171923e8;
      pointer-events: none;
    }

    #message {
      font-weight: bold;
      margin: 0 0 5px;
    }

    #detail {
      margin: 0;
      color: #d4d7e3;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
    }

    a-scene canvas,
    a-scene video,
    .mindar-ui-overlay,
    .mindar-ui-scanning {
      /* กล้องและ Canvas ต้องเต็มหน้าจอ */
    }

    .error {
      color: #ffb4a9;
    }
  </style>
</head>

<body>
  <header class="header">
    <h1>🐶 DOG AR</h1>
    <p>ส่องรูปหมาเพื่อดูโมเดล 3D</p>
  </header>

  <button class="back" onclick="location.href='./index.html'">
    ← กลับหน้าหลัก
  </button>

  <div class="status">
    <p id="message">กำลังเริ่มระบบ AR...</p>
    <p id="detail">โปรดรอและอนุญาตให้เว็บไซต์ใช้กล้อง</p>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item
        id="dogModel"
        src="./dog_puppy.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="dogTarget"
      mindar-image-target="targetIndex: 0">

      <a-gltf-model
        id="dog"
        src="#dogModel"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.1 0.1 0.1">
      </a-gltf-model>

    </a-entity>
  </a-scene>

  <script>
    const message = document.getElementById("message");
    const detail = document.getElementById("detail");
    const scene = document.querySelector("a-scene");
    const target = document.getElementById("dogTarget");
    const dog = document.getElementById("dog");

    let modelLoaded = false;
    let targetFound = false;

    function updateStatus() {
      if (targetFound && modelLoaded) {
        message.textContent = "🐶 พบรูปหมาแล้ว!";
        detail.textContent = "โมเดลโหลดแล้วและควรปรากฏบนรูป";
      } else if (targetFound && !modelLoaded) {
        message.textContent = "พบรูปแล้ว แต่โมเดลยังไม่โหลด";
        detail.textContent = "ตรวจสอบไฟล์ dog_puppy.glb";
      } else if (modelLoaded) {
        message.textContent = "โมเดลพร้อมแล้ว";
        detail.textContent = "ส่องรูปที่ใช้สร้าง targets.mind";
      } else {
        message.textContent = "กำลังโหลดโมเดล...";
        detail.textContent = "รอให้ระบบเตรียมไฟล์เสร็จ";
      }
    }

    dog.addEventListener("model-loaded", function () {
      modelLoaded = true;
      updateStatus();
      console.log("MODEL_LOADED");
    });

    dog.addEventListener("model-error", function (event) {
      message.textContent = "โหลดโมเดลไม่สำเร็จ";
      detail.textContent = "ตรวจสอบไฟล์ dog_puppy.glb และชื่อไฟล์";
      console.error("MODEL_ERROR", event);
    });

    target.addEventListener("targetFound", function () {
      targetFound = true;
      updateStatus();
      console.log("TARGET_FOUND");
    });

    target.addEventListener("targetLost", function () {
      targetFound = false;
      message.textContent = "กำลังค้นหารูป...";
      detail.textContent = "หันกล้องไปยังรูป Tracker";
    });

    scene.addEventListener("arReady", function () {
      message.textContent = "กล้องพร้อมใช้งาน";
      detail.textContent = "ส่องไปที่รูปหมา";
      updateStatus();
      console.log("AR_READY");
    });

    scene.addEventListener("arError", function (event) {
      message.textContent = "ระบบ AR เกิดข้อผิดพลาด";
      detail.textContent = "ตรวจสอบสิทธิ์กล้องและไฟล์ Tracker";
      console.error("AR_ERROR", event);
    });
  </script>
</body>
</html>
