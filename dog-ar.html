
<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOG AR</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #171923;
  font-family: Arial, Tahoma, sans-serif;
}

body {
  position: relative;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}

.header {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 0;
  width: 100%;
  padding: 14px;
  color: white;
  text-align: center;
  z-index: 10;
  pointer-events: none;
}

.header h1 {
  margin: 0 0 6px;
  color: #ffbd69;
  font-size: 24px;
}

.header p {
  margin: 0;
  font-size: 13px;
}

.back {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 75px);
  left: 12px;
  z-index: 20;
  border: none;
  border-radius: 10px;
  padding: 11px 14px;
  background: #ffbd69;
  color: #222;
  font-weight: bold;
}

.status {
  position: fixed;
  z-index: 20;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  left: 4%;
  width: 92%;
  padding: 14px;
  border: 1px solid #ffffff35;
  border-radius: 16px;
  background: #171923eF;
  color: white;
  text-align: center;
  pointer-events: none;
}

#message {
  margin: 0 0 5px;
  font-weight: bold;
  font-size: 16px;
}

#detail {
  margin: 0;
  color: #d9dce6;
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
</style>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script>
AFRAME.registerComponent('fit-dog', {
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const model = this.el.getObject3D('mesh');
      if (!model) return;

      const THREE = AFRAME.THREE;
      model.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      if (!Number.isFinite(size.y) || size.y <= 0) {
        console.error('Invalid model size');
        return;
      }

      const targetHeight = 0.6;
      const scale = targetHeight / size.y;

      model.scale.setScalar(scale);
      model.updateMatrixWorld(true);

      const scaledBox = new THREE.Box3().setFromObject(model);
      const scaledCenter = scaledBox.getCenter(new THREE.Vector3());

      model.position.x -= scaledCenter.x;
      model.position.y -= scaledBox.min.y;
      model.position.z -= scaledCenter.z;

      this.el.emit('dog-ready');
    });
  }
});

AFRAME.registerComponent('dog-animation', {
  init: function () {
    this.mixer = null;
    this.el.addEventListener('model-loaded', (event) => {
      const model = event.detail.model;

      if (model.animations && model.animations.length) {
        this.mixer = new AFRAME.THREE.AnimationMixer(model);
        this.mixer.clipAction(model.animations[0]).play();
      }
    });
  },

  tick: function (time, delta) {
    if (this.mixer && delta > 0) {
      this.mixer.update(delta / 1000);
    }
  }
});
</script>
</head>

<body>

<header class="header">
  <h1>🐶 DOG AR</h1>
  <p>หันกล้องไปที่รูปหมาเพื่อแสดงโมเดล 3D</p>
</header>

<button class="back" onclick="location.href='./index.html'">
  ← กลับหน้าหลัก
</button>

<div class="status">
  <p id="message">กำลังเตรียมระบบ AR...</p>
  <p id="detail">กรุณารอสักครู่</p>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="30000">
    <a-asset-item
      id="dogModel"
      src="./dog_puppy.glb">
    </a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">

    <a-entity
      id="dog"
      gltf-model="#dogModel"
      fit-dog
      dog-animation
      position="0 0 0"
      rotation="0 0 0">
    </a-entity>

  </a-entity>

</a-scene>

<script>
const message = document.getElementById('message');
const detail = document.getElementById('detail');
const scene = document.querySelector('a-scene');
const target = document.getElementById('target');
const dog = document.getElementById('dog');

let modelReady = false;
let targetFound = false;
let arStarted = false;

function updateStatus() {
  if (!arStarted) {
    message.textContent = 'กำลังเปิดกล้อง...';
    detail.textContent = 'ตรวจสอบสิทธิ์กล้องและรอสักครู่';
  } else if (!modelReady) {
    message.textContent = 'กล้องเริ่มทำงานแล้ว';
    detail.textContent = 'กำลังโหลดโมเดลหมา 3D';
  } else if (targetFound) {
    message.textContent = '🐶 พบรูปหมาแล้ว!';
    detail.textContent = 'กำลังแสดงโมเดล 3D';
  } else {
    message.textContent = 'กล้องพร้อมแล้ว';
    detail.textContent = 'ส่องกล้องไปที่รูปหมาที่ใช้สร้าง targets.mind';
  }
}

scene.addEventListener('arReady', () => {
  arStarted = true;
  updateStatus();
});

scene.addEventListener('arError', (event) => {
  message.textContent = 'เปิดกล้องหรือระบบ AR ไม่สำเร็จ';
  detail.textContent =
    'ตรวจสอบสิทธิ์กล้อง การเชื่อมต่ออินเทอร์เน็ต และเปิดเว็บผ่าน HTTPS';
  console.error('AR ERROR', event);
});

dog.addEventListener('dog-ready', () => {
  modelReady = true;
  updateStatus();
});

dog.addEventListener('model-error', (event) => {
  message.textContent = 'โหลดโมเดลหมาไม่สำเร็จ';
  detail.textContent = 'ตรวจสอบไฟล์ dog_puppy.glb';
  console.error('MODEL ERROR', event);
});

target.addEventListener('targetFound', () => {
  targetFound = true;
  updateStatus();
});

target.addEventListener('targetLost', () => {
  targetFound = false;
  updateStatus();
});

scene.addEventListener('loaded', () => {
  detail.textContent = 'กำลังเริ่มระบบกล้องและโหลดโมเดล';
});
</script>

</body>
</html>
