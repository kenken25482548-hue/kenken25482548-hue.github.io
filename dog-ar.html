
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>DOG AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171923;
      color: white;
      font-family: Arial, Tahoma, sans-serif;
    }

    /* เต็มหน้าจอ แต่ไม่บังคับตำแหน่งวิดีโอ/Canvas */
    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
    }

    .header {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: 0;
      width: 100%;
      padding: 14px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(#17192399, transparent);
    }

    .header h1 {
      color: #ffbd69;
      font-size: 25px;
      margin: 0 0 6px;
    }

    .header p {
      font-size: 14px;
      margin: 0;
    }

    .back {
      position: fixed;
      z-index: 20;
      top: calc(env(safe-area-inset-top, 0px) + 82px);
      left: 12px;
      border: none;
      border-radius: 12px;
      padding: 12px 15px;
      background: #ffbd69;
      color: #222;
      font-weight: bold;
    }

    .status {
      position: fixed;
      z-index: 10;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      left: 4%;
      width: 92%;
      padding: 16px;
      text-align: center;
      border: 1px solid #ffffff30;
      border-radius: 18px;
      background: rgba(20, 22, 34, .94);
      pointer-events: none;
    }

    #message {
      margin: 0 0 6px;
      font-weight: bold;
      font-size: 16px;
    }

    #detail {
      margin: 0;
      color: #d9dce6;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>🐶 DOG AR</h1>
    <p>ส่องรูปหมาเพื่อดูโมเดล 3D</p>
  </header>

  <button class="back" onclick="location.href='./index.html'">
    ← กลับหน้าหลัก
  </button>

  <div class="status">
    <p id="message">กำลังเริ่มระบบ AR...</p>
    <p id="detail">โปรดอนุญาตให้ใช้กล้อง</p>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "
    renderer="alpha: true; colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item
        id="dogModel"
        src="./dog_puppy.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="dogTarget"
      mindar-image-target="targetIndex: 0">

      <a-gltf-model
        id="dog"
        src="#dogModel"
        position="0 0 0.05"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-gltf-model>

    </a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const dog = document.querySelector('#dog');
    const target = document.querySelector('#dogTarget');
    const message = document.querySelector('#message');
    const detail = document.querySelector('#detail');

    let arReady = false;
    let modelReady = false;
    let targetFound = false;

    function updateStatus() {
      if (!arReady) return;

      if (targetFound && modelReady) {
        message.textContent = '🐶 พบรูปแล้ว!';
        detail.textContent = 'โมเดลหมาควรปรากฏบนรูป Tracker';
      } else if (targetFound && !modelReady) {
        message.textContent = 'พบรูปแล้ว กำลังโหลดโมเดล';
        detail.textContent = 'รอไฟล์ dog_puppy.glb';
      } else if (modelReady) {
        message.textContent = 'กล้องพร้อมแล้ว';
        detail.textContent = 'ส่องไปที่รูปที่ใช้สร้าง targets.mind';
      } else {
        message.textContent = 'กำลังโหลดโมเดลหมา';
        detail.textContent = 'โปรดรอสักครู่';
      }
    }

    dog.addEventListener('model-loaded', () => {
      modelReady = true;
      console.log('DOG MODEL LOADED');
      updateStatus();
    });

    dog.addEventListener('model-error', (event) => {
      message.textContent = 'โหลดโมเดลไม่สำเร็จ';
      detail.textContent = 'ตรวจสอบไฟล์ dog_puppy.glb';
      console.error('DOG MODEL ERROR', event);
    });

    target.addEventListener('targetFound', () => {
      targetFound = true;
      console.log('TARGET FOUND');
      updateStatus();
    });

    target.addEventListener('targetLost', () => {
      targetFound = false;
      message.textContent = 'กำลังค้นหารูปหมา...';
      detail.textContent = 'หันกล้องกลับไปที่รูป Tracker';
    });

    scene.addEventListener('arReady', () => {
      arReady = true;
      console.log('AR READY');
      updateStatus();
    });

    scene.addEventListener('arError', (event) => {
      message.textContent = 'เปิดกล้องไม่สำเร็จ';
      detail.textContent = 'ตรวจสอบสิทธิ์กล้องและไฟล์ Tracker';
      console.error('AR ERROR', event);
    });
  </script>

</body>
</html>
