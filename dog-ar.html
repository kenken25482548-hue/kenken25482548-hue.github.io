
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog AR</title>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #171923;
      color: white;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px;
      text-align: center;
      background: rgba(23, 25, 35, 0.85);
      z-index: 10;
      pointer-events: none;
    }

    .topbar h1 {
      margin: 0 0 5px;
      font-size: 22px;
    }

    .topbar p {
      margin: 0;
      font-size: 14px;
      color: #d7d8e0;
    }

    #status {
      position: fixed;
      bottom: 22px;
      left: 5%;
      width: 90%;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      background: rgba(23, 25, 35, 0.9);
      z-index: 10;
      pointer-events: none;
    }

    .back {
      position: fixed;
      top: 100px;
      left: 16px;
      z-index: 20;
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      background: #ffb45e;
      color: #222;
      font-weight: bold;
      cursor: pointer;
    }

    a-scene {
      position: fixed;
      inset: 0;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h1>🐶 Dog AR</h1>
    <p>ส่องกล้องไปที่รูปหมาเพื่อดูโมเดล 3D</p>
  </div>

  <button class="back" onclick="location.href='./index.html'">
    ← กลับหน้าหลัก
  </button>

  <div id="status">กำลังเตรียมระบบ AR...</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;
                  autoStart: true;
                  uiLoading: no;
                  uiScanning: no;
                  uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <a-asset-item
        id="dogModel"
        src="./dog_puppy.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="dogTarget"
      mindar-image-target="targetIndex: 0">

      <a-gltf-model
        id="dog"
        src="#dogModel"
        position="0 -0.2 0.15"
        rotation="0 0 0"
        scale="0.2 0.2 0.2">
      </a-gltf-model>

    </a-entity>
  </a-scene>

  <script>
    const status = document.getElementById("status");
    const target = document.getElementById("dogTarget");
    const dog = document.getElementById("dog");
    const scene = document.querySelector("a-scene");

    dog.addEventListener("model-loaded", () => {
      status.textContent = "โมเดลหมาพร้อมแล้ว ส่องรูปหมาได้เลย";
    });

    dog.addEventListener("model-error", () => {
      status.textContent =
        "โหลดโมเดลไม่ได้ กรุณาตรวจสอบไฟล์ dog_puppy.glb";
    });

    target.addEventListener("targetFound", () => {
      status.textContent = "🐶 พบรูปแล้ว! กำลังแสดงโมเดลหมา";
    });

    target.addEventListener("targetLost", () => {
      status.textContent = "ส่องกล้องไปที่รูปหมาเพื่อแสดงโมเดล";
    });

    scene.addEventListener("arReady", () => {
      status.textContent = "อนุญาตกล้องแล้ว ส่องไปที่รูปหมาได้เลย";
    });

    scene.addEventListener("arError", () => {
      status.textContent =
        "เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้องและเปิดผ่าน HTTPS";
    });
  </script>
</body>
</html>
