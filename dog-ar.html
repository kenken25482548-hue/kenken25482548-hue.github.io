
<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOG AR</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #171923;
  font-family: Arial, Tahoma, sans-serif;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}

.header {
  position: fixed;
  top: env(safe-area-inset-top, 10px);
  left: 0;
  width: 100%;
  padding: 14px;
  color: white;
  text-align: center;
  z-index: 10;
  pointer-events: none;
}

.header h1 {
  margin: 0 0 6px;
  color: #ffbd69;
  font-size: 25px;
}

.header p {
  margin: 0;
  font-size: 14px;
}

.back {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 80px);
  left: 12px;
  z-index: 20;
  border: none;
  border-radius: 12px;
  padding: 12px 15px;
  background: #ffbd69;
  color: #222;
  font-weight: bold;
}

.status {
  position: fixed;
  z-index: 10;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 15px);
  left: 4%;
  width: 92%;
  padding: 15px;
  border: 1px solid #ffffff35;
  border-radius: 18px;
  background: #171923ed;
  color: white;
  text-align: center;
  pointer-events: none;
}

#message {
  margin: 0 0 6px;
  font-size: 16px;
  font-weight: bold;
}

#detail {
  margin: 0;
  color: #d9dce6;
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.marker-link {
  position: fixed;
  z-index: 10;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 115px);
  left: 50%;
  transform: translateX(-50%);
  padding: 9px 13px;
  border-radius: 10px;
  color: white;
  background: #171923df;
  text-decoration: none;
  font-size: 13px;
  white-space: nowrap;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>

<script>
AFRAME.registerComponent('fit-dog', {
  init: function () {
    this.el.addEventListener('model-loaded', (event) => {
      const model = event.detail.model;
      const THREE = AFRAME.THREE;

      model.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      if (!Number.isFinite(size.y) || size.y <= 0) {
        console.error('Invalid dog model size', size);
        return;
      }

      const targetHeight = 1.5;
      const scale = targetHeight / size.y;

      model.position.set(-center.x, -box.min.y, -center.z);
      this.el.object3D.scale.setScalar(scale);
      this.el.object3D.updateMatrixWorld(true);

      this.el.emit('dog-model-ready');
      console.log('Dog model size:', size);
      console.log('Dog model scale:', scale);
    });
  }
});

AFRAME.registerComponent('play-dog-animation', {
  init: function () {
    this.mixer = null;

    this.el.addEventListener('model-loaded', (event) => {
      const model = event.detail.model;

      if (model.animations && model.animations.length > 0) {
        this.mixer = new AFRAME.THREE.AnimationMixer(model);
        this.mixer.clipAction(model.animations[0]).play();
      }
    });
  },

  tick: function (time, delta) {
    if (this.mixer) {
      this.mixer.update(delta / 1000);
    }
  }
});
</script>
</head>

<body>
<header class="header">
  <h1>🐶 DOG AR</h1>
  <p>ส่องกล้องไปที่ Marker เพื่อดูหมา 3D</p>
</header>

<button class="back" onclick="location.href='./index.html'">
  ← กลับหน้าหลัก
</button>

<a class="marker-link"
   href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/HIRO.jpg"
   target="_blank" rel="noopener">
   เปิดรูป Hiro Marker
</a>

<div class="status">
  <p id="message">กำลังเริ่มกล้อง...</p>
  <p id="detail">กรุณาอนุญาตให้เว็บไซต์ใช้กล้อง</p>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
  renderer="alpha: true; antialias: true; colorManagement: true"
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-assets timeout="30000">
    <a-asset-item
      id="dogModel"
      src="./dog_puppy.glb">
    </a-asset-item>
  </a-assets>

  <a-marker
    id="hiroMarker"
    preset="hiro"
    smooth="true"
    smoothCount="5"
    smoothTolerance=".01"
    smoothThreshold="2">

    <a-entity
      id="dog"
      gltf-model="#dogModel"
      fit-dog
      play-dog-animation>
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const message = document.getElementById('message');
const detail = document.getElementById('detail');
const marker = document.getElementById('hiroMarker');
const dog = document.getElementById('dog');

let modelReady = false;
let markerFound = false;
let cameraReady = false;

function updateStatus() {
  if (!cameraReady) {
    message.textContent = 'กำลังเปิดกล้อง...';
    detail.textContent = 'อนุญาตสิทธิ์กล้องในเบราว์เซอร์';
  } else if (!modelReady) {
    message.textContent = 'กล้องทำงานแล้ว';
    detail.textContent = 'กำลังโหลดโมเดลหมา 3D';
  } else if (markerFound) {
    message.textContent = '🐶 พบ Marker แล้ว!';
    detail.textContent = 'โมเดลหมาควรแสดงอยู่บนรูป Hiro';
  } else {
    message.textContent = 'กล้องพร้อมแล้ว';
    detail.textContent = 'ส่องกล้องไปที่รูป Hiro Marker';
  }
}

dog.addEventListener('model-loaded', () => {
  modelReady = true;
  updateStatus();
});

dog.addEventListener('model-error', (event) => {
  message.textContent = 'โหลดโมเดลหมาไม่สำเร็จ';
  detail.textContent = 'ตรวจสอบไฟล์ dog_puppy.glb';
  console.error('DOG MODEL ERROR', event);
});

marker.addEventListener('markerFound', () => {
  markerFound = true;
  updateStatus();
});

marker.addEventListener('markerLost', () => {
  markerFound = false;
  updateStatus();
});

document.querySelector('a-scene').addEventListener('loaded', () => {
  console.log('A-Frame scene loaded');
});

let cameraCheckCount = 0;

const cameraCheck = setInterval(() => {
  const video = document.querySelector('video');

  if (video && video.srcObject && video.readyState >= 2) {
    cameraReady = true;
    clearInterval(cameraCheck);
    updateStatus();
    console.log('CAMERA VIDEO READY');
  }

  cameraCheckCount++;

  if (cameraCheckCount >= 30) {
    clearInterval(cameraCheck);

    if (!cameraReady) {
      message.textContent = 'ยังเปิดภาพกล้องไม่ได้';
      detail.textContent = 'ตรวจสิทธิ์กล้อง หรือเปิดหน้าเว็บด้วย Safari';
      console.error('Camera video not ready');
    }
  }
}, 500);
</script>
</body>
</html>
