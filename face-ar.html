<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101321">
<title>Funny Robot Face AR</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101321;
  font-family: Arial, Tahoma, sans-serif;
}

#video, #canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

#video {
  z-index: 0;
  object-fit: cover;
  transform: scaleX(-1);
  background: #101321;
}

#canvas {
  z-index: 1;
  pointer-events: none;
}

#controls {
  position: fixed;
  z-index: 10;
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 0 12px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px 18px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#start {
  background: #ffbd69;
  color: #171923;
}

#switch {
  background: white;
  color: #171923;
}

button:disabled {
  opacity: .6;
}

#panel {
  position: fixed;
  z-index: 5;
  left: 4%;
  width: 92%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  padding: 16px;
  border: 1px solid #41465a;
  border-radius: 18px;
  background: rgba(16, 19, 33, .93);
  color: white;
  text-align: center;
  pointer-events: none;
}

#status {
  margin: 0 0 8px;
  font-size: 17px;
  font-weight: bold;
}

#help {
  margin: 0;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="controls">
  <button id="start">เปิดกล้องหน้า</button>
  <button id="switch" hidden>สลับกล้อง</button>
</div>

<div id="panel">
  <p id="status">พร้อมเปิดกล้อง</p>
  <p id="help">กดปุ่มเพื่อเริ่ม Face AR</p>
</div>

<script type="module">
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const startBtn = document.getElementById('start');
const switchBtn = document.getElementById('switch');
const statusEl = document.getElementById('status');
const helpEl = document.getElementById('help');

const MODEL_URL = new URL(
  './funny_robot_head.glb',
  window.location.href
).href;

// ใช้ URL เต็มและ CDN ที่จัดการ dependencies ของ Three.js
const THREE_URL = 'https://esm.sh/three@0.160.0';
const GLTF_URL =
  'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const VISION_URL =
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

let THREE = null;
let renderer = null;
let scene = null;
let camera = null;
let robot = null;
let landmarker = null;
let stream = null;

let busy = false;
let running = false;
let facingMode = 'user';
let frameId = 0;
let lastVideoTime = -1;
let baseModelSize = 1;
let resizeHandler = null;

function setStatus(title, detail) {
  statusEl.textContent = title;
  helpEl.textContent = detail;
}

function stopStream() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.srcObject = null;
}

function stopTracking() {
  running = false;

  if (frameId) {
    cancelAnimationFrame(frameId);
    frameId = 0;
  }

  if (landmarker) {
    try {
      landmarker.close();
    } catch (e) {
      console.warn(e);
    }
    landmarker = null;
  }

  stopStream();

  if (robot) {
    robot.visible = false;
  }
}

async function startCamera() {
  if (busy) return;

  busy = true;
  startBtn.disabled = true;

  try {
    setStatus('กำลังเริ่มกล้อง...', 'กำลังตรวจสอบระบบ');

    if (!window.isSecureContext) {
      throw new Error(
        'ต้องเปิดผ่าน HTTPS ของ GitHub Pages'
      );
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error(
        'เบราว์เซอร์ไม่รองรับการเปิดกล้องบนหน้านี้'
      );
    }

    running = false;

    if (frameId) {
      cancelAnimationFrame(frameId);
      frameId = 0;
    }

    if (landmarker) {
      try {
        landmarker.close();
      } catch (e) {}
      landmarker = null;
    }

    stopStream();

    // เรียกกล้องจากการกดปุ่มโดยตรง
    setStatus(
      'กำลังขออนุญาตกล้อง',
      'กรุณารอให้กล้องเริ่มทำงาน'
    );

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;
    await video.play();

    setStatus(
      'เปิดกล้องสำเร็จ',
      'กำลังโหลดระบบ 3D'
    );

    await initThree();
    await initFaceDetection();

    running = true;
    lastVideoTime = -1;

    startBtn.hidden = true;
    switchBtn.hidden = false;

    setStatus(
      'Face AR พร้อมใช้งาน',
      'หันหน้าเข้าหากล้อง'
    );

    frameId = requestAnimationFrame(trackFrame);

  } catch (error) {
    console.error('Face AR error:', error);

    running = false;
    stopStream();

    if (landmarker) {
      try {
        landmarker.close();
      } catch (e) {}
      landmarker = null;
    }

    let message = error.message || 'เกิดข้อผิดพลาด';

    if (error.name === 'NotAllowedError' ||
        error.name === 'PermissionDeniedError') {
      message = 'การเข้าถึงกล้องถูกปฏิเสธ';
    } else if (error.name === 'NotFoundError') {
      message = 'ไม่พบกล้องในอุปกรณ์';
    } else if (error.name === 'NotReadableError') {
      message = 'ไม่สามารถเปิดกล้องได้ในขณะนี้';
    }

    setStatus('เริ่มต้นไม่สำเร็จ', message);

    startBtn.hidden = false;
    switchBtn.hidden = true;

  } finally {
    busy = false;
    startBtn.disabled = false;
  }
}

async function initThree() {
  if (renderer && robot) return;

  setStatus(
    'กำลังโหลด Three.js',
    'กำลังดาวน์โหลดไลบรารี 3D'
  );

  // ไม่มี import('three') แบบชื่อเปล่า
  const [threeModule, loaderModule] = await Promise.all([
    import(THREE_URL),
    import(GLTF_URL)
  ]);

  THREE = threeModule;

  const GLTFLoader = loaderModule.GLTFLoader;

  if (!GLTFLoader) {
    throw new Error('โหลด GLTFLoader ไม่สำเร็จ');
  }

  if (!renderer) {
    renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: true,
      antialias: true,
      powerPreference: 'high-performance'
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    scene = new THREE.Scene();

    camera = new THREE.OrthographicCamera(
      -1, 1, 1, -1, 0.01, 100
    );

    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    scene.add(
      new THREE.HemisphereLight(
        0xffffff,
        0x555577,
        2
      )
    );

    const keyLight = new THREE.DirectionalLight(
      0xffffff,
      2.5
    );
    keyLight.position.set(1, 2, 5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(
      0xffffff,
      1.2
    );
    fillLight.position.set(-3, 1, 4);
    scene.add(fillLight);

    resizeHandler = resizeScene;
    window.addEventListener('resize', resizeHandler);
    resizeScene();
  }

  setStatus(
    'กำลังโหลดหัวหุ่นยนต์',
    'กำลังอ่าน funny_robot_head.glb'
  );

  const gltf = await new Promise((resolve, reject) => {
    new GLTFLoader().load(
      MODEL_URL,
      resolve,
      undefined,
      error => {
        console.error('GLB loading error:', error);
        reject(new Error(
          'โหลด funny_robot_head.glb ไม่สำเร็จ ตรวจชื่อและตำแหน่งไฟล์ใน GitHub'
        ));
      }
    );
  });

  robot = gltf.scene;

  const bounds = new THREE.Box3().setFromObject(robot);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();

  bounds.getSize(size);
  bounds.getCenter(center);

  const maxSize = Math.max(size.x, size.y, size.z);

  if (!Number.isFinite(maxSize) || maxSize <= 0) {
    throw new Error('ขนาดโมเดล GLB ไม่ถูกต้อง');
  }

  // วางจุดหมุนไว้ตรงกลางโมเดล
  robot.position.sub(center);

  baseModelSize = maxSize;
  robot.scale.setScalar(1 / maxSize);
  robot.visible = false;

  scene.add(robot);
  renderer.render(scene, camera);
}

function resizeScene() {
  if (!renderer || !camera) return;

  const width = window.innerWidth;
  const height = window.innerHeight;
  const aspect = width / height;

  renderer.setSize(width, height, false);

  camera.left = -aspect;
  camera.right = aspect;
  camera.top = 1;
  camera.bottom = -1;
  camera.updateProjectionMatrix();
}

async function initFaceDetection() {
  setStatus(
    'กำลังโหลดระบบตรวจจับใบหน้า',
    'กรุณารอสักครู่'
  );

  const vision = await import(
    VISION_URL + '/vision_bundle.mjs'
  );

  const files = await vision.FilesetResolver.forVisionTasks(
    VISION_URL + '/wasm'
  );

  const options = {
    baseOptions: {
      modelAssetPath:
        'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
      delegate: 'GPU'
    },
    runningMode: 'VIDEO',
    numFaces: 1,
    outputFaceBlendshapes: false,
    outputFacialTransformationMatrixes: false
  };

  try {
    landmarker =
      await vision.FaceLandmarker.createFromOptions(
        files,
        options
      );
  } catch (error) {
    console.warn('GPU unavailable; trying CPU', error);

    options.baseOptions.delegate = 'CPU';

    landmarker =
      await vision.FaceLandmarker.createFromOptions(
        files,
        options
      );
  }
}

function trackFrame() {
  if (!running) return;

  try {
    if (
      video.readyState >= 2 &&
      landmarker &&
      renderer &&
      scene &&
      camera
    ) {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;

        const result = landmarker.detectForVideo(
          video,
          performance.now()
        );

        if (result.faceLandmarks &&
            result.faceLandmarks.length > 0) {
          updateRobot(result.faceLandmarks[0]);
        } else if (robot) {
          robot.visible = false;
        }
      }

      renderer.render(scene, camera);
    }
  } catch (error) {
    console.error('Face tracking error:', error);
  }

  frameId = requestAnimationFrame(trackFrame);
}

function updateRobot(points) {
  if (!robot || !THREE || points.length < 264) return;

  const leftEye = points[33];
  const rightEye = points[263];
  const nose = points[1];

  const forehead = points[10];
  const chin = points[152];

  if (!leftEye || !rightEye || !nose ||
      !forehead || !chin) {
    return;
  }

  const eyeDistance = Math.hypot(
    rightEye.x - leftEye.x,
    rightEye.y - leftEye.y
  );

  if (!Number.isFinite(eyeDistance) ||
      eyeDistance < 0.001) {
    return;
  }

  const aspect = window.innerWidth / window.innerHeight;

  // ตำแหน่งใบหน้าในภาพที่กลับด้าน
  const targetX = (0.5 - nose.x) * 2 * aspect;
  const targetY = (0.5 - nose.y) * 2;

  // ขนาดตามระยะห่างระหว่างดวงตา
  const targetScale = Math.max(
    0.12,
    Math.min(eyeDistance * 2.5, 1.8)
  );

  const roll = Math.atan2(
    rightEye.y - leftEye.y,
    rightEye.x - leftEye.x
  );

  const smoothing = 0.35;

  robot.position.x +=
    (targetX - robot.position.x) * smoothing;

  robot.position.y +=
    (targetY - robot.position.y) * smoothing;

  const currentScale = robot.scale.x * baseModelSize;

  const nextScale =
    currentScale +
    (targetScale - currentScale) * smoothing;

  robot.scale.setScalar(nextScale / baseModelSize);

  robot.rotation.z +=
    (-roll - robot.rotation.z) * smoothing;

  robot.visible = true;
}

async function switchCamera() {
  if (busy) return;

  facingMode =
    facingMode === 'user' ? 'environment' : 'user';

  stopTracking();

  startBtn.hidden = false;
  switchBtn.hidden = true;

  setStatus('กำลังสลับกล้อง', 'กรุณารอสักครู่');

  await startCamera();
}

startBtn.addEventListener('click', startCamera);
switchBtn.addEventListener('click', switchCamera);

window.addEventListener('pagehide', () => {
  running = false;

  if (frameId) {
    cancelAnimationFrame(frameId);
  }

  stopStream();

  if (landmarker) {
    try {
      landmarker.close();
    } catch (e) {}
  }

  if (renderer) {
    renderer.dispose();
  }

  if (resizeHandler) {
    window.removeEventListener('resize', resizeHandler);
  }
});
</script>

</body>
</html>
