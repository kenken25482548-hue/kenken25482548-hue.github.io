<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101321">
<title>Robot Face Texture AR</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101321;
  font-family: Arial, Tahoma, sans-serif;
}

#video, #canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

#video {
  object-fit: cover;
  transform: scaleX(-1);
  background: #101321;
  z-index: 0;
}

#canvas {
  z-index: 1;
  pointer-events: none;
}

#controls {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 10px;
  z-index: 10;
  padding: 0 12px;
}

button {
  border: 0;
  border-radius: 13px;
  padding: 14px 19px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#start {
  background: #ffbd69;
  color: #171923;
}

#switch {
  background: #fff;
  color: #171923;
}

button:disabled {
  opacity: .6;
}

#panel {
  position: fixed;
  z-index: 5;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  left: 4%;
  width: 92%;
  padding: 15px;
  border: 1px solid #41465a;
  border-radius: 18px;
  background: rgba(16, 19, 33, .93);
  color: white;
  text-align: center;
  pointer-events: none;
}

#status {
  margin: 0 0 7px;
  font-size: 17px;
  font-weight: bold;
}

#help {
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="controls">
  <button id="start">เปิดกล้อง</button>
  <button id="switch" hidden>สลับกล้อง</button>
</div>

<div id="panel">
  <p id="status">Robot Face AR</p>
  <p id="help">กดเปิดกล้องเพื่อเริ่มใช้งาน</p>
</div>

<script type="module">
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('start');
const switchBtn = document.getElementById('switch');
const statusEl = document.getElementById('status');
const helpEl = document.getElementById('help');

const VISION_URL =
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

let stream = null;
let landmarker = null;
let busy = false;
let running = false;
let facingMode = 'user';
let frameId = 0;
let lastVideoTime = -1;
let lastResult = null;
let lastFaceTime = 0;

let faceX = 0;
let faceY = 0;
let faceW = 0;
let faceH = 0;
let faceRoll = 0;
let faceVisible = false;

let smileValue = 0;
let mouthValue = 0;
let blinkValue = 0;

function status(title, detail) {
  statusEl.textContent = title;
  helpEl.textContent = detail;
}

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth;
  const h = window.innerHeight;

  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
}

function stopAR() {
  running = false;

  if (frameId) {
    cancelAnimationFrame(frameId);
    frameId = 0;
  }

  if (landmarker) {
    try {
      landmarker.close();
    } catch (e) {
      console.warn(e);
    }
    landmarker = null;
  }

  stopCamera();
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
}

async function startAR() {
  if (busy) return;

  busy = true;
  startBtn.disabled = true;

  try {
    status('กำลังเปิดกล้อง', 'กรุณารอสักครู่');

    if (!window.isSecureContext) {
      throw new Error('กรุณาเปิดผ่าน HTTPS');
    }

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('เบราว์เซอร์ไม่รองรับกล้อง');
    }

    running = false;

    if (frameId) {
      cancelAnimationFrame(frameId);
      frameId = 0;
    }

    if (landmarker) {
      try {
        landmarker.close();
      } catch (e) {}
      landmarker = null;
    }

    stopCamera();

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;
    await video.play();

    status('กำลังโหลดระบบตรวจจับใบหน้า', 'กำลังดาวน์โหลด MediaPipe');

    const vision = await import(
      VISION_URL + '/vision_bundle.mjs'
    );

    const files = await vision.FilesetResolver.forVisionTasks(
      VISION_URL + '/wasm'
    );

    const options = {
      baseOptions: {
        modelAssetPath:
          'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numFaces: 1,
      outputFaceBlendshapes: true
    };

    try {
      landmarker =
        await vision.FaceLandmarker.createFromOptions(
          files,
          options
        );
    } catch (gpuError) {
      console.warn('GPU unavailable, trying CPU', gpuError);

      options.baseOptions.delegate = 'CPU';

      landmarker =
        await vision.FaceLandmarker.createFromOptions(
          files,
          options
        );
    }

    running = true;
    lastVideoTime = -1;

    startBtn.hidden = true;
    switchBtn.hidden = false;

    status('Robot Face AR พร้อมใช้งาน', 'ลองยิ้ม อ้าปาก และกะพริบตา');
    frameId = requestAnimationFrame(loop);

  } catch (error) {
    console.error('Robot Face AR error:', error);

    running = false;
    stopCamera();

    if (landmarker) {
      try {
        landmarker.close();
      } catch (e) {}
      landmarker = null;
    }

    let message = error.message || 'เกิดข้อผิดพลาด';

    if (error.name === 'NotAllowedError') {
      message = 'ไม่สามารถเข้าถึงกล้องได้';
    } else if (error.name === 'NotFoundError') {
      message = 'ไม่พบกล้อง';
    }

    status('เริ่มต้นไม่สำเร็จ', message);
    startBtn.hidden = false;
    switchBtn.hidden = true;

  } finally {
    busy = false;
    startBtn.disabled = false;
  }
}

function getBlendshape(categories, name) {
  if (!categories) return 0;

  const item = categories.find(
    x => x.categoryName === name
  );

  return item ? item.score : 0;
}

function updateFace(result) {
  const faces = result.faceLandmarks;

  if (!faces || faces.length === 0) {
    faceVisible = false;
    return;
  }

  const points = faces[0];
  const W = window.innerWidth;
  const H = window.innerHeight;

  const left = points[234];
  const right = points[454];
  const forehead = points[10];
  const chin = points[152];
  const leftEye = points[33];
  const rightEye = points[263];

  if (!left || !right || !forehead || !chin) {
    faceVisible = false;
    return;
  }

  // ปรับพิกัดให้ตรงกับวิดีโอที่กลับด้าน
  const coverScale = Math.max(
    W / video.videoWidth,
    H / video.videoHeight
  );

  const renderedW = video.videoWidth * coverScale;
  const renderedH = video.videoHeight * coverScale;
  const offsetX = (W - renderedW) / 2;
  const offsetY = (H - renderedH) / 2;

  function screenPoint(p) {
    return {
      x: offsetX + p.x * renderedW,
      y: offsetY + p.y * renderedH
    };
  }

  const L = screenPoint(left);
  const R = screenPoint(right);
  const F = screenPoint(forehead);
  const C = screenPoint(chin);
  const E1 = screenPoint(leftEye);
  const E2 = screenPoint(rightEye);

  faceX = (L.x + R.x) / 2;
  faceY = (F.y + C.y) / 2;
  faceW = Math.hypot(R.x - L.x, R.y - L.y) * 1.28;
  faceH = Math.hypot(C.x - F.x, C.y - F.y) * 1.22;

  faceRoll = Math.atan2(
    E2.y - E1.y,
    E2.x - E1.x
  );

  const categories =
    result.faceBlendshapes?.[0]?.categories;

  const smile = Math.max(
    getBlendshape(categories, 'mouthSmileLeft'),
    getBlendshape(categories, 'mouthSmileRight')
  );

  const jawOpen = getBlendshape(categories, 'jawOpen');

  const blinkL = getBlendshape(categories, 'eyeBlinkLeft');
  const blinkR = getBlendshape(categories, 'eyeBlinkRight');

  // ทำให้การเปลี่ยนสีหน้าดูนุ่มนวลขึ้น
  smileValue += (smile - smileValue) * 0.45;
  mouthValue += (jawOpen - mouthValue) * 0.5;
  blinkValue += (Math.max(blinkL, blinkR) - blinkValue) * 0.6;

  faceVisible = true;
  lastFaceTime = performance.now();
}

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

function drawRobotFace() {
  const W = window.innerWidth;
  const H = window.innerHeight;

  ctx.clearRect(0, 0, W, H);

  if (!faceVisible) {
    if (performance.now() - lastFaceTime > 250) {
      return;
    }
  }

  if (faceW <= 0 || faceH <= 0) return;

  // กระจกพิกัดเดียวกับภาพกล้องหน้า
  ctx.save();
  ctx.translate(W, 0);
  ctx.scale(-1, 1);

  ctx.translate(faceX, faceY);
  ctx.rotate(faceRoll);

  const w = faceW;
  const h = faceH;
  const s = w / 240;

  ctx.scale(s, s);

  // เงาด้านหลังหัว
  ctx.fillStyle = '#11162b';
  roundedRect(-126, -146, 252, 292, 28);
  ctx.fill();

  // หูหุ่นยนต์
  ctx.fillStyle = '#278ca5';
  roundedRect(-145, -65, 22, 100, 7);
  ctx.fill();

  roundedRect(123, -65, 22, 100, 7);
  ctx.fill();

  // กรอบหน้า
  const gradient = ctx.createLinearGradient(-120, -130, 120, 140);
  gradient.addColorStop(0, '#7253ef');
  gradient.addColorStop(0.55, '#3c4ed7');
  gradient.addColorStop(1, '#182b76');

  ctx.fillStyle = '#10152b';
  roundedRect(-128, -148, 256, 296, 27);
  ctx.fill();

  ctx.fillStyle = gradient;
  roundedRect(-116, -136, 232, 272, 21);
  ctx.fill();

  // หน้าจอด้านใน
  ctx.fillStyle = '#151c3b';
  roundedRect(-101, -119, 202, 238, 15);
  ctx.fill();

  // แถบตกแต่ง
  ctx.fillStyle = '#16e5df';
  roundedRect(-88, -106, 176, 8, 4);
  ctx.fill();

  // สีหน้ากำหนดจากการตรวจจับจริง
  const isBlinking = blinkValue > 0.53;
  const isSmiling = smileValue > 0.34;
  const isSurprised = mouthValue > 0.48;

  // ดวงตา
  const eyeY = -38;
  const eyeW = 65;
  const eyeH = isBlinking ? 8 : 57;

  for (const eyeX of [-68, 68]) {
    ctx.fillStyle = '#080d20';
    roundedRect(
      eyeX - eyeW / 2 - 5,
      eyeY - eyeH / 2 - 5,
      eyeW + 10,
      eyeH + 10,
      12
    );
    ctx.fill();

    ctx.fillStyle = isBlinking ? '#3f6d91' : '#24e8ee';
    roundedRect(
      eyeX - eyeW / 2,
      eyeY - eyeH / 2,
      eyeW,
      eyeH,
      9
    );
    ctx.fill();

    if (!isBlinking) {
      ctx.fillStyle = '#fff';
      roundedRect(
        eyeX - 17,
        eyeY - 15,
        15,
        13,
        4
      );
      ctx.fill();

      ctx.fillStyle = '#127dba';
      roundedRect(
        eyeX - 10,
        eyeY + 9,
        21,
        16,
        5
      );
      ctx.fill();
    } else {
      ctx.fillStyle = '#a2ffff';
      ctx.fillRect(eyeX - 25, eyeY - 2, 50, 4);
    }
  }

  // จมูก
  ctx.fillStyle = '#ffbd69';
  ctx.beginPath();
  ctx.arc(0, 30, 8, 0, Math.PI * 2);
  ctx.fill();

  // ปากเปลี่ยนตามการอ้าปากและยิ้ม
  const mouthY = 78;
  const mouthWidth = 88 + smileValue * 30;
  const mouthHeight = isSurprised
    ? 46 + mouthValue * 23
    : 13 + smileValue * 22;

  ctx.fillStyle = '#080d20';
  ctx.beginPath();

  if (isSmiling && !isSurprised) {
    ctx.moveTo(-mouthWidth / 2, mouthY - 5);
    ctx.quadraticCurveTo(
      0,
      mouthY + mouthHeight * 2.2,
      mouthWidth / 2,
      mouthY - 5
    );
    ctx.quadraticCurveTo(
      0,
      mouthY + mouthHeight * 2.7,
      -mouthWidth / 2,
      mouthY - 5
    );
  } else if (isSurprised) {
    ctx.ellipse(
      0,
      mouthY,
      mouthWidth * 0.32,
      mouthHeight * 0.65,
      0,
      0,
      Math.PI * 2
    );
  } else {
    ctx.ellipse(
      0,
      mouthY,
      mouthWidth / 2,
      mouthHeight / 2,
      0,
      0,
      Math.PI * 2
    );
  }

  ctx.fill();

  // ฟันเมื่อยิ้ม
  if (isSmiling && !isSurprised) {
    ctx.fillStyle = '#fff';
    roundedRect(-30, mouthY - 2, 60, 10, 4);
    ctx.fill();
  }

  // ไฟสถานะ
  ctx.fillStyle = isSmiling
    ? '#5bff9d'
    : isSurprised
      ? '#ffbd69'
      : '#20e4ff';

  ctx.beginPath();
  ctx.arc(0, 119, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function loop() {
  if (!running) return;

  try {
    if (
      landmarker &&
      video.readyState >= 2 &&
      video.videoWidth > 0
    ) {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;

        const result = landmarker.detectForVideo(
          video,
          performance.now()
        );

        lastResult = result;
        updateFace(result);
      }

      drawRobotFace();
    }
  } catch (error) {
    console.error('Face tracking error:', error);
  }

  frameId = requestAnimationFrame(loop);
}

async function switchCamera() {
  if (busy) return;

  facingMode =
    facingMode === 'user' ? 'environment' : 'user';

  stopAR();

  startBtn.hidden = false;
  switchBtn.hidden = true;

  await startAR();
}

startBtn.addEventListener('click', startAR);
switchBtn.addEventListener('click', switchCamera);

window.addEventListener('pagehide', () => {
  running = false;

  if (frameId) {
    cancelAnimationFrame(frameId);
  }

  stopCamera();

  if (landmarker) {
    try {
      landmarker.close();
    } catch (e) {}
  }
});
</script>

</body>
</html>
