
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101321">
<title>Robot Face AR | Expression Tracker</title>

<style>
:root {
  --bg: #0b0e1c;
  --panel: rgba(20, 25, 47, .94);
  --line: #343d61;
  --cyan: #28f0f4;
  --purple: #8d65ff;
  --yellow: #ffca72;
  --white: #f4f6ff;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--white);
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

#video, #canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

#video {
  z-index: 0;
  object-fit: cover;
  transform: scaleX(-1);
  background: var(--bg);
}

#canvas {
  z-index: 1;
  pointer-events: none;
}

#topbar {
  position: fixed;
  z-index: 5;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 13px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
  backdrop-filter: blur(12px);
}

.brand-icon {
  width: 35px;
  height: 35px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #8c5dff, #19dce8);
  font-size: 20px;
}

.brand-title {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .6px;
}

.brand-subtitle {
  margin-top: 3px;
  color: #aab4d9;
  font-size: 10px;
}

#liveBadge {
  border: 1px solid #285b60;
  border-radius: 30px;
  padding: 9px 12px;
  background: rgba(10, 36, 42, .9);
  color: #69fff1;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
}

#controls {
  position: fixed;
  z-index: 8;
  top: calc(env(safe-area-inset-top, 0px) + 83px);
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: center;
  gap: 9px;
}

button {
  border: 1px solid transparent;
  border-radius: 13px;
  padding: 12px 17px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#start {
  background: linear-gradient(135deg, #ffd48a, #ffad57);
  color: #21152a;
  box-shadow: 0 5px 24px #ffbd6930;
}

#switch {
  background: rgba(25, 30, 55, .95);
  color: white;
  border-color: #485171;
}

button:disabled {
  opacity: .55;
}

#bottomPanel {
  position: fixed;
  z-index: 5;
  left: 14px;
  right: 14px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  max-height: 42vh;
  overflow-y: auto;
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 21px;
  background: var(--panel);
  backdrop-filter: blur(15px);
  box-shadow: 0 12px 45px #0005;
}

#statusRow {
  display: flex;
  align-items: center;
  gap: 10px;
}

#statusDot {
  flex: 0 0 auto;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--yellow);
  box-shadow: 0 0 13px currentColor;
}

#status {
  margin: 0;
  font-size: 15px;
  font-weight: 800;
}

#help {
  margin: 7px 0 14px;
  color: #aeb9d9;
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.section-label {
  margin-bottom: 9px;
  color: #a6b2d9;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.2px;
}

#expressionGrid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
}

.expression {
  min-width: 0;
  padding: 9px 2px 8px;
  border: 1px solid #303958;
  border-radius: 12px;
  background: #11162b;
  text-align: center;
  transition: border-color .12s, background .12s;
}

.expression.active {
  border-color: var(--cyan);
  background: #12333d;
  box-shadow: inset 0 0 15px #28f0f415;
}

.expression .emoji {
  display: block;
  margin-bottom: 5px;
  font-size: 19px;
}

.expression .name {
  display: block;
  color: #aeb9d9;
  font-size: 9px;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.expression.active .name {
  color: #7efff4;
  font-weight: 800;
}

#confidence {
  margin-top: 13px;
}

#confidenceHeader {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: #aeb9d9;
  font-size: 10px;
}

#bar {
  height: 5px;
  margin-top: 7px;
  border-radius: 10px;
  background: #29314d;
  overflow: hidden;
}

#barFill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--purple), var(--cyan));
  transition: width .12s;
}

[hidden] { display: none !important; }

@media (max-height: 650px) {
  #bottomPanel { max-height: 36vh; padding: 11px; }
  #controls { top: calc(env(safe-area-inset-top, 0px) + 70px); }
  .expression { padding: 6px 1px; }
  .expression .emoji { font-size: 16px; }
  #help { margin-bottom: 9px; }
}

</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="topbar">
  <div class="brand">
    <div class="brand-icon">🤖</div>
    <div>
      <div class="brand-title">ROBOT FACE AR</div>
      <div class="brand-subtitle">FACIAL EXPRESSION TRACKER</div>
    </div>
  </div>
  <div id="liveBadge">● STANDBY</div>
</div>

<div id="controls">
  <button id="start">เปิดกล้อง</button>
  <button id="switch" hidden>⇄ สลับกล้อง</button>
</div>

<div id="bottomPanel">
  <div id="statusRow">
    <span id="statusDot"></span>
    <p id="status">พร้อมเริ่มต้น</p>
  </div>
  <p id="help">กดเปิดกล้องเพื่อเริ่มตรวจจับสีหน้า</p>

  <div class="section-label">FACIAL EXPRESSIONS · 5 STATES</div>

  <div id="expressionGrid">
    <div class="expression active" data-state="neutral">
      <span class="emoji">🤖</span>
      <span class="name">ปกติ</span>
    </div>
    <div class="expression" data-state="blink">
      <span class="emoji">😑</span>
      <span class="name">กะพริบตา</span>
    </div>
    <div class="expression" data-state="open">
      <span class="emoji">😮</span>
      <span class="name">อ้าปาก</span>
    </div>
    <div class="expression" data-state="smile">
      <span class="emoji">😄</span>
      <span class="name">ยิ้ม</span>
    </div>
    <div class="expression" data-state="frown">
      <span class="emoji">😠</span>
      <span class="name">หน้าบึ้ง</span>
    </div>
  </div>

  <div id="confidence">
    <div id="confidenceHeader">
      <span id="expressionText">สถานะ: ปกติ</span>
      <span id="confidenceText">รอใบหน้า</span>
    </div>
    <div id="bar"><div id="barFill"></div></div>
  </div>
</div>

<script type="module">
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const startBtn = document.getElementById('start');
const switchBtn = document.getElementById('switch');
const statusEl = document.getElementById('status');
const helpEl = document.getElementById('help');
const statusDot = document.getElementById('statusDot');
const liveBadge = document.getElementById('liveBadge');
const expressionText = document.getElementById('expressionText');
const confidenceText = document.getElementById('confidenceText');
const barFill = document.getElementById('barFill');
const expressionCards = [
  ...document.querySelectorAll('.expression')
];

const VISION_URL =
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

let stream = null;
let landmarker = null;
let busy = false;
let running = false;
let facingMode = 'user';
let frameId = 0;
let lastVideoTime = -1;
let lastFaceTime = 0;
let face = null;
let currentState = 'neutral';
let lostFrames = 0;

const values = {
  smile: 0,
  open: 0,
  blink: 0,
  frown: 0
};

function setStatus(title, detail, good = false) {
  statusEl.textContent = title;
  helpEl.textContent = detail;
  statusDot.style.background = good ? '#44ffd0' : '#ffca72';
  liveBadge.textContent = good ? '● TRACKING' : '● STANDBY';
  liveBadge.style.color = good ? '#69fff1' : '#ffca72';
}

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth;
  const h = window.innerHeight;

  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function stopStream() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.srcObject = null;
}

function stopAR() {
  running = false;

  if (frameId) {
    cancelAnimationFrame(frameId);
    frameId = 0;
  }

  if (landmarker) {
    try { landmarker.close(); } catch (e) {}
    landmarker = null;
  }

  stopStream();
  face = null;
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
}

async function startAR() {
  if (busy) return;

  busy = true;
  startBtn.disabled = true;

  try {
    setStatus('กำลังเปิดกล้อง', 'กำลังเตรียมระบบตรวจจับใบหน้า');

    if (!window.isSecureContext) {
      throw new Error('กรุณาเปิดเว็บไซต์ผ่าน HTTPS');
    }

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('เบราว์เซอร์ไม่รองรับการเปิดกล้อง');
    }

    running = false;

    if (frameId) {
      cancelAnimationFrame(frameId);
      frameId = 0;
    }

    if (landmarker) {
      try { landmarker.close(); } catch (e) {}
      landmarker = null;
    }

    stopStream();

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;
    await video.play();

    setStatus('กำลังโหลด AI', 'กำลังโหลด MediaPipe Face Landmarker');

    const vision = await import(VISION_URL + '/vision_bundle.mjs');

    const files = await vision.FilesetResolver.forVisionTasks(
      VISION_URL + '/wasm'
    );

    const options = {
      baseOptions: {
        modelAssetPath:
          'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numFaces: 1,
      outputFaceBlendshapes: true
    };

    try {
      landmarker = await vision.FaceLandmarker.createFromOptions(
        files, options
      );
    } catch (gpuError) {
      console.warn('GPU fallback to CPU', gpuError);
      options.baseOptions.delegate = 'CPU';

      landmarker = await vision.FaceLandmarker.createFromOptions(
        files, options
      );
    }

    running = true;
    lastVideoTime = -1;
    lostFrames = 0;

    startBtn.hidden = true;
    switchBtn.hidden = false;

    setStatus('ระบบพร้อมตรวจจับ', 'ลองทำสีหน้าทั้ง 5 แบบ', true);
    frameId = requestAnimationFrame(loop);

  } catch (error) {
    console.error(error);
    running = false;
    stopStream();

    if (landmarker) {
      try { landmarker.close(); } catch (e) {}
      landmarker = null;
    }

    setStatus('เริ่มต้นไม่สำเร็จ', error.message || 'เกิดข้อผิดพลาด');

    startBtn.hidden = false;
    switchBtn.hidden = true;

  } finally {
    busy = false;
    startBtn.disabled = false;
  }
}

function score(categories, name) {
  if (!categories) return 0;
  const found = categories.find(x => x.categoryName === name);
  return found ? found.score : 0;
}

function smooth(key, next, amount = 0.38) {
  values[key] += (next - values[key]) * amount;
  return values[key];
}

function getScreenPoint(p) {
  const W = window.innerWidth;
  const H = window.innerHeight;

  const scale = Math.max(
    W / video.videoWidth,
    H / video.videoHeight
  );

  const renderedW = video.videoWidth * scale;
  const renderedH = video.videoHeight * scale;
  const offsetX = (W - renderedW) / 2;
  const offsetY = (H - renderedH) / 2;

  // กล้องหน้าแสดงแบบ mirror
  return {
    x: offsetX + (1 - p.x) * renderedW,
    y: offsetY + p.y * renderedH
  };
}

function analyze(result) {
  const points = result.faceLandmarks?.[0];

  if (!points || points.length < 455) {
    lostFrames++;

    if (lostFrames > 5) {
      face = null;
      selectState('neutral', 0);
    }
    return;
  }

  lostFrames = 0;

  const left = getScreenPoint(points[234]);
  const right = getScreenPoint(points[454]);
  const top = getScreenPoint(points[10]);
  const chin = getScreenPoint(points[152]);
  const eyeL = getScreenPoint(points[33]);
  const eyeR = getScreenPoint(points[263]);
  const nose = getScreenPoint(points[1]);

  const width = Math.hypot(
    right.x - left.x,
    right.y - left.y
  );

  const height = Math.hypot(
    chin.x - top.x,
    chin.y - top.y
  );

  const categories = result.faceBlendshapes?.[0]?.categories;

  const smileRaw = Math.max(
    score(categories, 'mouthSmileLeft'),
    score(categories, 'mouthSmileRight')
  );

  const openRaw = score(categories, 'jawOpen');

  const blinkRaw = Math.max(
    score(categories, 'eyeBlinkLeft'),
    score(categories, 'eyeBlinkRight')
  );

  const frownRaw = Math.max(
    score(categories, 'mouthFrownLeft'),
    score(categories, 'mouthFrownRight')
  );

  const smile = smooth('smile', smileRaw);
  const open = smooth('open', openRaw, 0.48);
  const blink = smooth('blink', blinkRaw, 0.65);
  const frown = smooth('frown', frownRaw);

  face = {
    x: nose.x,
    y: nose.y,
    width: width * 1.17,
    height: height * 1.12,
    roll: Math.atan2(
      eyeR.y - eyeL.y,
      eyeR.x - eyeL.x
    )
  };

  lastFaceTime = performance.now();

  let nextState = 'neutral';
  let strength = 0.2;

  // ลำดับนี้ช่วยแยกสีหน้าที่เกิดพร้อมกัน
  if (blink > 0.56) {
    nextState = 'blink';
    strength = blink;
  } else if (open > 0.48) {
    nextState = 'open';
    strength = open;
  } else if (smile > 0.36) {
    nextState = 'smile';
    strength = smile;
  } else if (frown > 0.38) {
    nextState = 'frown';
    strength = frown;
  }

  selectState(nextState, strength);
}

const stateLabels = {
  neutral: 'ปกติ',
  blink: 'กะพริบตา',
  open: 'อ้าปาก',
  smile: 'ยิ้ม',
  frown: 'หน้าบึ้ง'
};

function selectState(state, strength) {
  currentState = state;

  expressionCards.forEach(card => {
    card.classList.toggle(
      'active',
      card.dataset.state === state
    );
  });

  expressionText.textContent = 'สถานะ: ' + stateLabels[state];

  confidenceText.textContent = face
    ? Math.round(Math.max(0, Math.min(1, strength)) * 100) + '%'
    : 'ไม่พบใบหน้า';

  barFill.style.width = face
    ? Math.round(Math.max(0, Math.min(1, strength)) * 100) + '%'
    : '0%';
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

function drawRobot() {
  const W = window.innerWidth;
  const H = window.innerHeight;

  ctx.clearRect(0, 0, W, H);

  if (!face) return;

  if (performance.now() - lastFaceTime > 500) return;

  ctx.save();

  // จุดกำเนิดและขนาดตามใบหน้าที่ตรวจพบ
  ctx.translate(face.x, face.y);
  ctx.rotate(face.roll);

  const scale = face.width / 220;
  ctx.scale(scale, scale);

  const s = currentState;
  const isBlink = s === 'blink';
  const isOpen = s === 'open';
  const isSmile = s === 'smile';
  const isFrown = s === 'frown';

  // เงาเรืองแสง
  ctx.shadowColor = '#28eaff55';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#11162d';
  roundRect(-119, -143, 238, 286, 25);
  ctx.fill();
  ctx.shadowBlur = 0;

  // หูหุ่นยนต์
  ctx.fillStyle = '#32d7e4';
  roundRect(-135, -53, 19, 80, 5);
  ctx.fill();
  roundRect(116, -53, 19, 80, 5);
  ctx.fill();

  ctx.fillStyle = '#8c65ff';
  roundRect(-139, -36, 8, 46, 3);
  ctx.fill();
  roundRect(131, -36, 8, 46, 3);
  ctx.fill();

  // ขอบหัวหลายชั้น
  const shell = ctx.createLinearGradient(-115, -140, 115, 140);
  shell.addColorStop(0, '#9d77ff');
  shell.addColorStop(.45, '#6650e8');
  shell.addColorStop(1, '#263c99');

  ctx.fillStyle = '#080d20';
  roundRect(-120, -145, 240, 290, 23);
  ctx.fill();

  ctx.fillStyle = shell;
  roundRect(-112, -137, 224, 274, 18);
  ctx.fill();

  ctx.fillStyle = '#10162d';
  roundRect(-99, -123, 198, 246, 12);
  ctx.fill();

  // เส้นกรอบหน้าจอ
  ctx.strokeStyle = '#29eaf0';
  ctx.lineWidth = 2;
  roundRect(-99, -123, 198, 246, 12);
  ctx.stroke();

  // ไฟด้านบน
  ctx.fillStyle = '#21e6ee';
  roundRect(-68, -113, 136, 5, 2.5);
  ctx.fill();

  ctx.fillStyle = '#a984ff';
  ctx.beginPath();
  ctx.arc(-78, -110.5, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(78, -110.5, 3, 0, Math.PI * 2);
  ctx.fill();

  // ดวงตา
  const eyeY = -39;
  const eyeW = 58;
  const eyeH = isBlink ? 7 : 52;

  for (const eyeX of [-57, 57]) {
    ctx.fillStyle = '#060a19';
    roundRect(
      eyeX - eyeW / 2 - 5,
      eyeY - eyeH / 2 - 5,
      eyeW + 10,
      eyeH + 10,
      9
    );
    ctx.fill();

    if (isBlink) {
      ctx.fillStyle = '#26edf0';
      roundRect(eyeX - 24, eyeY - 3, 48, 6, 3);
      ctx.fill();

      ctx.strokeStyle = '#9cffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(eyeX - 19, eyeY - 7);
      ctx.lineTo(eyeX + 19, eyeY - 7);
      ctx.stroke();
    } else {
      const eyeGradient = ctx.createLinearGradient(
        eyeX, eyeY - eyeH / 2,
        eyeX, eyeY + eyeH / 2
      );

      eyeGradient.addColorStop(0, '#74ffff');
      eyeGradient.addColorStop(.55, '#20dce9');
      eyeGradient.addColorStop(1, '#3488f9');

      ctx.fillStyle = eyeGradient;
      roundRect(
        eyeX - eyeW / 2,
        eyeY - eyeH / 2,
        eyeW,
        eyeH,
        7
      );
      ctx.fill();

      // รูม่านตาเปลี่ยนตามสีหน้า
      ctx.fillStyle = '#13376b';

      if (isFrown) {
        ctx.fillRect(eyeX - 15, eyeY - 2, 30, 17);
      } else {
        roundRect(eyeX - 14, eyeY - 8, 28, 25, 5);
        ctx.fill();
      }

      // ไฮไลต์
      ctx.fillStyle = '#ffffff';
      roundRect(eyeX - 18, eyeY - 17, 13, 9, 3);
      ctx.fill();

      ctx.fillStyle = '#93ffff';
      roundRect(eyeX + 7, eyeY + 8, 7, 7, 2);
      ctx.fill();
    }
  }

  // คิ้ว
  ctx.lineCap = 'round';
  ctx.lineWidth = 5;
  ctx.strokeStyle = isFrown ? '#ffbd69' : '#8f7bff';

  ctx.beginPath();
  if (isFrown) {
    ctx.moveTo(-86, -77);
    ctx.lineTo(-30, -67);
    ctx.moveTo(30, -67);
    ctx.lineTo(86, -77);
  } else {
    ctx.moveTo(-84, -72);
    ctx.lineTo(-34, -72);
    ctx.moveTo(34, -72);
    ctx.lineTo(84, -72);
  }
  ctx.stroke();

  // จมูกเป็นเซนเซอร์
  const noseColor = isOpen ? '#ffca72' : '#b58cff';
  ctx.fillStyle = noseColor;
  ctx.shadowColor = noseColor;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(0, 24, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // ปาก: วาดรูปทรงต่างกันทั้ง 5 สถานะ
  const mouthY = 71;

  if (isOpen) {
    ctx.fillStyle = '#030612';
    ctx.beginPath();
    ctx.ellipse(0, mouthY, 26, 28, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ffca72';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#ff6fae';
    ctx.beginPath();
    ctx.ellipse(0, mouthY + 15, 13, 8, 0, 0, Math.PI * 2);
    ctx.fill();

  } else if (isSmile) {
    ctx.fillStyle = '#030612';
    ctx.beginPath();
    ctx.moveTo(-46, mouthY - 9);
    ctx.quadraticCurveTo(0, mouthY + 43, 46, mouthY - 9);
    ctx.quadraticCurveTo(0, mouthY + 19, -46, mouthY - 9);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-32, mouthY - 3);
    ctx.quadraticCurveTo(0, mouthY + 17, 32, mouthY - 3);
    ctx.lineTo(26, mouthY + 7);
    ctx.quadraticCurveTo(0, mouthY + 20, -26, mouthY + 7);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#21e8f0';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-47, mouthY - 8);
    ctx.quadraticCurveTo(0, mouthY + 43, 47, mouthY - 8);
    ctx.stroke();

  } else if (isFrown) {
    ctx.strokeStyle = '#ff829c';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(-39, mouthY + 13);
    ctx.quadraticCurveTo(0, mouthY - 21, 39, mouthY + 13);
    ctx.stroke();

  } else {
    ctx.strokeStyle = '#27e9ee';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-34, mouthY);
    ctx.lineTo(34, mouthY);
    ctx.stroke();

    ctx.fillStyle = '#8c65ff';
    roundRect(-27, mouthY - 3, 54, 6, 3);
    ctx.fill();
  }

  // ไฟสถานะใต้ปาก
  const ledColor = isSmile
    ? '#4bffac'
    : isOpen
      ? '#ffca72'
      : isFrown
        ? '#ff6b92'
        : '#28f0f4';

  ctx.fillStyle = ledColor;
  ctx.shadowColor = ledColor;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(0, 111, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // สกรูมุมหัว
  ctx.fillStyle = '#b6c5ff';
  for (const x of [-101, 101]) {
    for (const y of [-125, 125]) {
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

function loop() {
  if (!running) return;

  try {
    if (
      landmarker &&
      video.readyState >= 2 &&
      video.videoWidth > 0 &&
      video.currentTime !== lastVideoTime
    ) {
      lastVideoTime = video.currentTime;

      const result = landmarker.detectForVideo(
        video,
        performance.now()
      );

      analyze(result);
    }

    drawRobot();
  } catch (error) {
    console.error('Tracking error:', error);
  }

  frameId = requestAnimationFrame(loop);
}

async function switchCamera() {
  if (busy) return;

  facingMode =
    facingMode === 'user' ? 'environment' : 'user';

  stopAR();
  startBtn.hidden = false;
  switchBtn.hidden = true;

  await startAR();
}

startBtn.addEventListener('click', startAR);
switchBtn.addEventListener('click', switchCamera);

window.addEventListener('pagehide', () => {
  running = false;

  if (frameId) cancelAnimationFrame(frameId);

  stopStream();

  if (landmarker) {
    try { landmarker.close(); } catch (e) {}
  }
});
</script>
