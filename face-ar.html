* { box-sizing: border-box; }

html, body {
  margin: 0;

  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;

  pointer-events: none;

.panel {
  position: fixed;
  z-index: 5;
  top: 12px;
  left: 12px;

  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

button {
  border: 0;
  border-radius: 12px;
