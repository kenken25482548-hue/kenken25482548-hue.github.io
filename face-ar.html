<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Funny Robot Face AR</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111522;
  font-family: Arial, Tahoma, sans-serif;
}

#video, #three {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#video {
  transform: scaleX(-1);
  z-index: 0;
}

#three {
  z-index: 1;
  pointer-events: none;
}

.panel {
  position: fixed;
  z-index: 5;
  left: 4%;
  width: 92%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding: 13px 15px;
  border-radius: 16px;
  background: #101522dd;
  color: white;
  text-align: center;
  border: 1px solid #ffffff30;
}

#status {
  font-weight: bold;
  margin: 0 0 5px;
}

#help {
  font-size: 12px;
  color: #d8deed;
  line-height: 1.45;
  margin: 0;
  overflow-wrap: anywhere;
}

#start {
  position: fixed;
  z-index: 10;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: 50%;
  transform: translateX(-50%);
  border: 0;
  border-radius: 12px;
  padding: 12px 17px;
  background: #ffbd69;
  color: #171923;
  font-weight: bold;
  font-size: 15px;
  white-space: nowrap;
}

#start:disabled {
  opacity: 0.65;
}

#switch {
  position: fixed;
  z-index: 10;
  top: calc(env(safe-area-inset-top, 0px) + 68px);
  right: 12px;
  border: 0;
  border-radius: 10px;
  padding: 10px 12px;
  background: white;
  color: #171923;
  font-weight: bold;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="three"></canvas>

<button id="start">เปิดกล้องหน้า</button>
<button id="switch" hidden>สลับกล้อง</button>

<div class="panel">
  <p id="status">กำลังเตรียมระบบ AR...</p>
  <p id="help">กดเปิดกล้องหน้าและ
